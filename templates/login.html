<!DOCTYPE html>
<html>

<head>

    <title>Login - AI Quiz Application</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-page">

    <header class="site-header">
        <a href="{{ url_for('home') }}" class="site-brand" aria-label="AI Quiz Application home">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="AI Quiz" class="navbar-logo">
            <span>AI-Powered Adaptive Quiz Application</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('login') }}" class="active" aria-current="page">Login</a>
            <a href="{{ url_for('register') }}">Register</a>
        </nav>
    </header>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back 👋</h1>

            <p class="auth-subtitle">
                Login to continue your quiz journey
            </p>

            {% if error %}
            <p class="error-message">{{ error }}</p>
            {% endif %}

            <form method="POST">

                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter Email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter Password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button">
                    Login
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</body>

</html>
