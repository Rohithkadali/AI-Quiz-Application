<!DOCTYPE html>
<html>

<head>
    <title>Register - AI Quiz Application</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">

    <header class="site-header">
        <a href="{{ url_for('home') }}" class="site-brand" aria-label="AI Quiz Application home">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="AI Quiz" class="navbar-logo">
            <span>AI-Powered Adaptive Quiz Application</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}" class="active" aria-current="page">Register</a>
        </nav>
    </header>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Register to start your quiz journey
            </p>

            <form method="POST">

                <div class="input-group">
                    <label>Full Name</label>
                    <input
                        type="text"
                        name="name"
                        placeholder="Enter Full Name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input
                        type="email"
                        name="email"
                        placeholder="Enter Email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        type="password"
                        name="password"
                        placeholder="Enter Password"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Enter Confirm Password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="auth-button">
                    Create Account
                </button>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

        </div>

    </div>

</body>

</html>
